apiVersion: v1
kind: Pod
metadata:
  name: test-911
  namespace: 911-platform
  labels:
    app: call-processing-test
spec:
  containers:
    - name: call-processing
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            echo "INFO Processing incoming 911 call"
            sleep 5
            echo "ERROR Database connection timeout"
            echo "ERROR Failed to process 911 call"
            sleep 5
          done